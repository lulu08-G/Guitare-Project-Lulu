<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Memory Sheets</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0d0a07;
  --bg2:      #14100c;
  --card:     #1c1510;
  --card2:    #231a12;
  --card3:    #2b2016;
  --border:   #362818;
  --border2:  #47341f;
  --cream:    #f4e8d1;
  --cream2:   #c8b49a;
  --cream3:   #7d6c58;
  --cream4:   #4a3c2c;
  --gold:     #c8783a;
  --gold2:    #e8964e;
  --gold3:    #f5b870;
  --sage:     #6a9070;
  --terra:    #b85840;
  --mauve:    #8a7aaa;
  --r: 18px; --rs: 11px; --rx: 7px;
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--cream2);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:inherit}
input,textarea,select{font-family:inherit}
a{text-decoration:none}

nav{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:62px;background:rgba(13,10,7,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:300}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo-mark{width:38px;height:38px;flex-shrink:0}
.logo-text{font-family:var(--serif);font-size:17px;color:var(--cream);letter-spacing:-.2px}
.logo-text span{color:var(--gold2)}
.nav-right{display:flex;gap:8px;align-items:center}

.btn{padding:9px 20px;border-radius:50px;font-size:13px;font-weight:600;transition:all .18s;white-space:nowrap;letter-spacing:.1px}
.btn-primary{background:var(--gold);color:#0d0a07;box-shadow:0 4px 18px rgba(200,120,58,.32)}
.btn-primary:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 6px 24px rgba(200,120,58,.45)}
.btn-ghost{background:var(--card2);color:var(--cream2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--card3);color:var(--cream)}
.btn-sm{padding:7px 15px;font-size:12px}
.btn-icon{width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--border);color:var(--cream2);display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0}
.btn-icon:hover{background:var(--card3);color:var(--cream)}
.btn-icon.danger:hover{color:var(--terra);border-color:var(--terra)}
.btn-icon.confirm-danger{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.view{display:none}.view.active{display:block}

.home-hero{max-width:980px;margin:0 auto;padding:44px 24px 28px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-text h1{font-family:var(--serif);font-size:clamp(26px,4vw,40px);font-weight:800;color:var(--cream);line-height:1.15;letter-spacing:-.4px}
.hero-text h1 em{color:var(--gold2);font-style:italic}
.hero-text p{color:var(--cream3);font-size:13px;margin-top:6px;font-weight:300;letter-spacing:.3px}
.search-wrap{max-width:980px;margin:0 auto 24px;padding:0 24px}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:50px;color:var(--cream);padding:11px 20px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,120,58,.12)}
.search-wrap input::placeholder{color:var(--cream4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px;padding:0 24px 60px;max-width:980px;margin:0 auto}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;transition:opacity .2s}
.card.c-gold::before{background:var(--gold);opacity:1}
.card.c-sage::before{background:var(--sage);opacity:1}
.card.c-terra::before{background:var(--terra);opacity:1}
.card.c-mauve::before{background:var(--mauve);opacity:1}
.card.c-cream::before{background:var(--cream2);opacity:1}
.card:hover{background:var(--card2);transform:translateY(-3px);box-shadow:0 14px 44px rgba(0,0,0,.45)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.card-icon{width:42px;height:42px;flex-shrink:0}
.card-actions{display:flex;gap:5px;opacity:0;transition:opacity .2s}
.card:hover .card-actions{opacity:1}
.card-actions button{width:28px;height:28px;border-radius:7px;background:var(--card3);color:var(--cream3);font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.card-actions button:hover{color:var(--cream);background:var(--border2)}
.card-actions button.confirm-danger{background:var(--terra);color:#fff;border-color:var(--terra)}
.card h3{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--cream);margin-bottom:3px;letter-spacing:-.2px}
.card .sub{font-size:12px;color:var(--cream3);margin-bottom:14px;letter-spacing:.2px}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:50px;font-size:11px;font-weight:600;letter-spacing:.2px}
.tg{background:rgba(200,120,58,.12);color:var(--gold2);border:1px solid rgba(200,120,58,.2)}
.ts{background:rgba(106,144,112,.1);color:var(--sage);border:1px solid rgba(106,144,112,.2)}
.td{background:rgba(138,122,170,.1);color:var(--mauve);border:1px solid rgba(138,122,170,.2)}
.tn{background:var(--card3);color:var(--cream3);border:1px solid var(--border)}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 24px}
.empty-icon{margin:0 auto 20px;opacity:.5}
.empty-state h3{font-family:var(--serif);color:var(--cream3);font-size:22px;margin-bottom:8px}
.empty-state p{font-size:14px;color:var(--cream4);margin-bottom:24px}

.sv-wrap{max-width:860px;margin:0 auto;padding:28px 24px 60px}
.sv-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.sv-title-block{flex:1;min-width:220px}
.sv-title-input{font-family:var(--serif);font-size:clamp(22px,3.5vw,34px);font-weight:800;color:var(--cream);letter-spacing:-.4px;background:none;border:none;outline:none;width:100%;padding:2px 0;border-radius:6px;transition:background .15s}
.sv-title-input:hover,.sv-title-input:focus{background:var(--card2)}
.sv-title-input::placeholder{color:var(--cream4)}
.sv-artist-input{font-size:13px;color:var(--cream3);margin-top:2px;letter-spacing:.3px;background:none;border:none;outline:none;width:100%;padding:2px 0;border-radius:6px;transition:background .15s}
.sv-artist-input:hover,.sv-artist-input:focus{background:var(--card2)}
.sv-artist-input::placeholder{color:var(--cream4)}
.sv-badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.badge{padding:5px 13px;border-radius:50px;font-size:12px;font-weight:600;letter-spacing:.2px}
.bg{background:rgba(200,120,58,.14);color:var(--gold2)}
.bs{background:rgba(106,144,112,.11);color:var(--sage)}
.bd{background:rgba(138,122,170,.11);color:var(--mauve)}
.by{background:rgba(184,88,64,.11);color:var(--terra);display:inline-flex;align-items:center;gap:5px}
.sv-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.autosave-indicator{font-size:11px;color:var(--sage);opacity:0;transition:opacity .3s;white-space:nowrap;letter-spacing:.3px}
.autosave-indicator.show{opacity:1}

.sections-list{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.sec-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:box-shadow .15s,opacity .15s}
.sec-card.dragging{opacity:.45;box-shadow:0 14px 36px rgba(0,0,0,.5)}
.sec-card-hdr{padding:11px 12px 11px 8px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sec-card.collapsed .sec-card-hdr{border-bottom:none}
.drag-handle{background:none;border:none;color:var(--cream4);cursor:grab;font-size:15px;padding:4px 6px;touch-action:none;flex-shrink:0;line-height:1;border-radius:5px;transition:background .15s,color .15s}
.drag-handle:hover{color:var(--cream2);background:var(--card3)}
.drag-handle:active{cursor:grabbing}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d0{background:var(--gold)}.d1{background:var(--sage)}.d2{background:var(--terra)}.d3{background:var(--mauve)}.d4{background:var(--cream2)}
.sec-name-input{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--cream2);background:none;border:none;outline:none;width:170px;flex-shrink:1;min-width:70px;border-radius:5px;padding:3px 5px;transition:background .15s}
.sec-name-input:hover,.sec-name-input:focus{background:var(--card3)}
.sec-name-input::placeholder{color:var(--cream4)}
.sec-comment-input{flex:1;min-width:60px;font-size:12px;color:var(--cream3);font-style:italic;background:none;border:none;outline:none;border-radius:5px;padding:3px 5px;transition:background .15s}
.sec-comment-input:hover,.sec-comment-input:focus{background:var(--card3)}
.sec-comment-input::placeholder{color:var(--cream4)}
.sec-card-actions{display:flex;gap:1px;flex-shrink:0}
.btn-icon-sm{width:26px;height:26px;border-radius:6px;background:none;border:none;color:var(--cream4);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-icon-sm:hover{background:var(--card3);color:var(--cream)}
.btn-icon-sm.danger:hover{color:var(--terra);background:rgba(184,88,64,.12)}
.sec-card-body{padding:18px 18px 20px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);transition:all .15s}
.chip:hover{border-color:var(--border2)}
.chip-main{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:5px 4px 5px 12px}
.chip-main .ccb-mini svg{width:26px;height:auto}
.chip-rm{background:none;border:none;color:var(--cream4);cursor:pointer;font-size:11px;padding:8px 10px 8px 4px;opacity:0;transition:opacity .15s}
.chip:hover .chip-rm{opacity:1}
.chip-rm:hover{color:var(--terra)}
.chip-add{background:none;border:1px dashed var(--border);color:var(--cream4);font-size:12px;font-weight:600;cursor:pointer;padding:10px 16px;border-radius:var(--rs);transition:all .15s}
.chip-add:hover{border-color:var(--gold);color:var(--gold)}
.rhythm-zone{margin-top:2px}
.rz-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--cream4);margin-bottom:6px}

.add-sec-btn{width:100%;padding:13px;border:2px dashed var(--border);background:none;border-radius:var(--r);color:var(--cream4);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;margin-bottom:18px}
.add-sec-btn:hover{border-color:var(--gold);color:var(--gold)}

.notes-block-ed{margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.notes-block-ed label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--cream4);margin-bottom:8px}
.notes-block-ed textarea{background:var(--bg2)}

.fg{margin-bottom:14px}
.frow{display:flex;gap:12px}.frow .fg{flex:1}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--cream3);margin-bottom:5px}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--cream);padding:10px 13px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,120,58,.1)}
input::placeholder,textarea::placeholder{color:var(--cream4)}
select option{background:var(--card)}
textarea{resize:vertical;min-height:68px;line-height:1.6}

.cswatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.csw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.csw:hover,.csw.on{transform:scale(1.2);border-color:var(--cream2)}
.csw-gold{background:var(--gold)}.csw-sage{background:var(--sage)}.csw-terra{background:var(--terra)}.csw-mauve{background:var(--mauve)}.csw-cream{background:var(--cream2)}

/* Chord chip - visual content used both in editable chips and read-only pick grid */
.ccb-mini{display:flex;align-items:center;flex-shrink:0}
.ccb-mini svg{display:block;width:32px;height:auto}
.ccb-label{font-size:13px;font-weight:700;color:var(--cream);font-family:var(--serif)}

/* Interactive rhythm curve editor */
.rce-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:14px}
.rce-bars{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:4px}
.rce-bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.rce-bar{width:34px;height:120px;background:var(--card2);border:1px solid var(--border);border-radius:8px;position:relative;cursor:ns-resize;touch-action:none;overflow:hidden}
.rce-mid{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border2);pointer-events:none}
.rce-fill{position:absolute;left:0;right:0;pointer-events:none}
.rce-fill.up{background:linear-gradient(0deg,transparent,#6a9070)}
.rce-fill.down{background:linear-gradient(180deg,transparent,#c8783a)}
.rce-handle{position:absolute;left:50%;width:16px;height:16px;border-radius:50%;background:var(--gold2);border:2px solid var(--bg2);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.rce-rm{background:none;border:none;color:var(--cream4);font-size:12px;cursor:pointer;padding:2px 6px}
.rce-rm:hover{color:var(--terra)}
.rce-controls{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.rce-hint{font-size:11px;color:var(--cream4);line-height:1.5}
.rce-preview{margin-top:12px}
.add-beat-btn{width:auto;padding:7px 14px;background:none;border:1px dashed var(--border);color:var(--cream4);border-radius:var(--rx);font-size:12px;cursor:pointer;transition:all .15s}
.add-beat-btn:hover{border-color:var(--gold);color:var(--gold)}

/* Chord picker modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;padding:24px}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--cream);margin-bottom:16px;display:flex;align-items:center}
.modal-search{margin-bottom:16px}
.chord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-bottom:20px}
.chord-pick-btn{background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 4px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.chord-pick-btn:hover{border-color:var(--gold);background:rgba(200,120,58,.08)}
.cp-name{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--cream)}
.modal-footer{display:flex;gap:9px;justify-content:flex-end;padding-top:14px;border-top:1px solid var(--border)}

.custom-chord-builder{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:16px;margin-top:16px}
.ccb-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:12px}
.fretboard-builder{display:flex;gap:4px;align-items:flex-end;justify-content:center;margin-bottom:12px}
.string-col{display:flex;flex-direction:column;align-items:center;gap:0}
.string-name{font-size:10px;color:var(--cream3);font-weight:600;margin-bottom:4px}
.fret-btn{width:36px;height:28px;background:var(--card);border:1px solid var(--border);color:var(--cream3);font-size:11px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
.fret-btn:first-of-type{border-radius:4px 4px 0 0}
.fret-btn:last-of-type{border-radius:0 0 4px 4px}
.fret-btn.on{background:var(--gold);color:#0d0a07;font-weight:700;border-color:var(--gold)}
.fret-btn.muted{background:var(--card2);color:var(--terra)}
.fret-btn.open{background:var(--card2);color:var(--sage)}
.ccb-name-inp{margin-bottom:10px}
.chord-preview-box{display:flex;justify-content:center;margin:10px 0}

.print-modal .modal{max-width:860px}
.print-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.ptab{padding:7px 16px;border-radius:50px;border:1px solid var(--border);background:var(--card2);color:var(--cream3);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.ptab.on{background:var(--gold);color:#0d0a07;border-color:var(--gold)}
.print-preview-area{background:white;border-radius:var(--rs);overflow:hidden;min-height:400px}
.print-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}

.toast{position:fixed;bottom:24px;right:24px;background:var(--sage);color:#0d0a07;padding:12px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:var(--terra)}

@media print{
  nav,.sv-btns,.card-actions,.toast,.modal-overlay,.add-sec-btn,.sec-card-actions,.drag-handle,.notes-block-ed{display:none!important}
  body{background:white;color:black}
  .sv-wrap{padding:0}
  .sec-card{border:1px solid #ccc;break-inside:avoid;margin-bottom:10px}
  .sec-card-hdr{background:#f5f5f5}
  .sec-name-input,.sec-comment-input{color:black}
}

@media(max-width:600px){
  .frow{flex-direction:column}
  .grid{grid-template-columns:1fr;padding:0 16px 40px}
  nav,.home-hero,.search-wrap,.sv-wrap{padding-left:16px;padding-right:16px}
  .sec-name-input{width:100px}
}
</style>
</head>
<body>

<nav>
  <div class="logo" onclick="goHome()">
    <svg class="logo-mark" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="38" height="38" rx="10" fill="#c8783a"/>
      <ellipse cx="19" cy="24" rx="8" ry="9" fill="#7a4a1a" stroke="#f5b870" stroke-width="1"/>
      <ellipse cx="19" cy="22" rx="5.5" ry="6.5" fill="#5a3510"/>
      <path d="M13 21 Q11 18 13 16 Q11 14 13 12" stroke="#f5b870" stroke-width="1" fill="none"/>
      <path d="M25 21 Q27 18 25 16 Q27 14 25 12" stroke="#f5b870" stroke-width="1" fill="none"/>
      <rect x="17" y="5" width="4" height="13" rx="2" fill="#7a4a1a" stroke="#c8783a" stroke-width=".5"/>
      <circle cx="19" cy="22" r="2.5" fill="#3a2010"/>
      <line x1="18" y1="7" x2="18" y2="30" stroke="#f5b870" stroke-width=".6" opacity=".6"/>
      <line x1="19" y1="7" x2="19" y2="30" stroke="#f5b870" stroke-width=".6" opacity=".6"/>
      <line x1="20" y1="7" x2="20" y2="30" stroke="#f5b870" stroke-width=".6" opacity=".6"/>
      <circle cx="16" cy="6" r="1.5" fill="#f5b870"/>
      <circle cx="19" cy="5" r="1.5" fill="#f5b870"/>
      <circle cx="22" cy="6" r="1.5" fill="#f5b870"/>
    </svg>
    <span class="logo-text">Guitar <span>Memory</span> Sheets</span>
  </div>
  <div class="nav-right">
    <button class="btn btn-ghost btn-sm" onclick="goHome()">Mes fiches</button>
    <button class="btn-icon" onclick="newSheet()" title="Nouvelle fiche">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
</nav>

<script>
/* ══════════ CHORD DATABASE ══════════ */
const CHORD_DB = {
  'Am': {f:[-1,0,2,2,1,0]}, 'A':  {f:[-1,0,2,2,2,0]}, 'A7': {f:[-1,0,2,0,2,0]},
  'Am7':{f:[-1,0,2,0,1,0]}, 'Asus2':{f:[-1,0,2,2,0,0]}, 'Asus4':{f:[-1,0,2,2,3,0]},
  'Bm': {f:[-1,2,4,4,3,2]}, 'B7': {f:[-1,2,1,2,0,2]},
  'C':  {f:[-1,3,2,0,1,0]}, 'Cmaj7':{f:[-1,3,2,0,0,0]}, 'C7': {f:[-1,3,2,3,1,0]}, 'Cadd9':{f:[-1,3,2,0,3,3]},
  'D':  {f:[-1,-1,0,2,3,2]}, 'Dm': {f:[-1,-1,0,2,3,1]}, 'D7': {f:[-1,-1,0,2,1,2]},
  'Dsus2':{f:[-1,-1,0,2,3,0]}, 'Dsus4':{f:[-1,-1,0,2,3,3]},
  'E':  {f:[0,2,2,1,0,0]}, 'Em': {f:[0,2,2,0,0,0]}, 'Em7':{f:[0,2,2,0,3,0]}, 'E7': {f:[0,2,0,1,0,0]},
  'F':  {f:[1,3,3,2,1,1]}, 'Fmaj7':{f:[0,3,3,2,1,0]}, 'F#m':{f:[2,4,4,2,2,2]},
  'G':  {f:[3,2,0,0,0,3]}, 'G7': {f:[3,2,0,0,0,1]}, 'Gmaj7':{f:[3,2,0,0,0,2]}, 'Gadd9':{f:[3,2,0,0,3,3]},
};

/* Rhythm presets — each beat: {dir:'down'|'up'|'silence', force:0..1}
   down => peak BELOW baseline, up => peak ABOVE baseline, size = force */
const RHYTHMS = [
  {id:'folk',   label:'Folk',    desc:'Bas fort, haut leger',
    beats:[{dir:'down',force:1},{dir:'up',force:.4},{dir:'down',force:.6},{dir:'up',force:.4}]},
  {id:'pop5',   label:'Pop',     desc:'Bas bas haut bas haut',
    beats:[{dir:'down',force:1},{dir:'down',force:.5},{dir:'up',force:.3},{dir:'down',force:1},{dir:'up',force:.3}]},
  {id:'waltz',  label:'Valse',   desc:'3 temps',
    beats:[{dir:'down',force:1},{dir:'down',force:.4},{dir:'down',force:.4}]},
  {id:'reggae', label:'Reggae',  desc:'Off-beat',
    beats:[{dir:'silence',force:0},{dir:'up',force:1},{dir:'silence',force:0},{dir:'up',force:1}]},
  {id:'arpege', label:'Arpege',  desc:'Fingerpicking',
    beats:[{dir:'down',force:.6},{dir:'up',force:.3},{dir:'up',force:.3},{dir:'up',force:.3}]},
  {id:'ballad', label:'Ballade', desc:'Lent, expressif',
    beats:[{dir:'down',force:1},{dir:'silence',force:0},{dir:'down',force:.4},{dir:'up',force:.3}]},
  {id:'rock',   label:'Rock',    desc:'4 coups forts',
    beats:[{dir:'down',force:1},{dir:'down',force:1},{dir:'down',force:1},{dir:'down',force:1}]},
  {id:'custom', label:'Personnalise', desc:'Creer ma courbe', beats:[]},
];

/* ══════════ STATE ══════════
   `sheets` = persisted library. `current` = the sheet being viewed/edited in
   memory (always the live source of truth while on the sheet view); it is
   written back into `sheets` + localStorage on a debounce (autosave). */
let sheets = [];
try { sheets = JSON.parse(localStorage.getItem('gms4_sheets') || '[]'); } catch(e){ sheets=[]; }

function migrateSheet(s) {
  if (!s.sections || !s.sections.length) {
    s.sections = [{
      name: 'Accords', comment: '',
      chords: (s.mainChords||[]).filter(c=>c&&c.name),
      rhythm: s.mainRhythm||'folk',
      customBeats: s.mainCustomBeats && s.mainCustomBeats.length ? s.mainCustomBeats.slice() : undefined,
      collapsed:false,
    }];
  }
  s.sections.forEach(sec=>{
    if (sec.collapsed===undefined) sec.collapsed=false;
    if (!sec.chords) sec.chords=[];
    if (!sec.rhythm) sec.rhythm='folk';
  });
  delete s.mainChords; delete s.mainRhythm; delete s.mainCustomBeats;
  if (!s.color) s.color='gold';
  return s;
}
sheets = sheets.map(migrateSheet);

let current = null;         // sheet currently open on view-sheet
let autosaveTimer = null;
let chordModalTarget = null; // {sectionIdx, chordIdx|null}
let currentPrintFormat = 'fiche';
let ccbFrets = [-1,0,0,0,0,0];
const STRING_NAMES = ['E','A','D','G','B','e'];
let secDragState = null;

const save = () => localStorage.setItem('gms4_sheets', JSON.stringify(sheets));
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const newBlankSection = (name) => ({name, comment:'', chords:[], rhythm:'folk', customBeats:undefined, collapsed:false});

/* ══════════ VIEWS ══════════ */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  window.scrollTo(0,0);
  if (name === 'home') renderHome();
}
function goHome() { current = null; showView('home'); }

/* ══════════ HOME ══════════ */
function renderHome() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const grid = document.getElementById('home-grid');
  const filtered = sheets.filter(s => !q || s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q));

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state">' +
      '<div class="empty-icon">' + woodGuitarSVG(64) + '</div>' +
      '<h3>' + (sheets.length === 0 ? 'Aucune fiche encore' : 'Aucun resultat') + '</h3>' +
      '<p>' + (sheets.length === 0 ? 'Creez votre premiere fiche.' : 'Essayez un autre terme.') + '</p>' +
      (sheets.length === 0 ? '<button class="btn btn-primary" onclick="newSheet()">+ Creer ma premiere fiche</button>' : '') +
      '</div>';
    return;
  }

  grid.innerHTML = filtered.map(s => `
    <div class="card c-${s.color||'gold'}" onclick="openSheetById('${s.id}')">
      <div class="card-head">
        <div class="card-icon">${miniInstrumentSVG(s.color||'gold')}</div>
        <div class="card-actions">
          <button onclick="event.stopPropagation();confirmThenDelete(this,()=>delSheet('${s.id}'))" title="Supprimer">${trashSVG()}</button>
        </div>
      </div>
      <h3>${esc(s.title)}</h3>
      <div class="sub">${esc(s.artist||'—')}</div>
      <div class="card-tags">
        ${s.capo>0?`<span class="tag tg">Capo ${s.capo}</span>`:''}
        ${s.bpm?`<span class="tag ts">${s.bpm} BPM</span>`:''}
        ${s.difficulty?`<span class="tag td">${esc(s.difficulty)}</span>`:''}
        <span class="tag tn">${s.sections.length} partie${s.sections.length>1?'s':''}</span>
      </div>
    </div>`).join('');
}

function delSheet(id) {
  sheets = sheets.filter(x=>x.id!==id);
  save();
  renderHome();
  toast('Fiche supprimee');
}

/* ══════════ CONFIRM-AGAIN (replaces blocking confirm() popups) ══════════ */
function confirmThenDelete(btn, doDelete) {
  if (btn.dataset.confirming === '1') { doDelete(); return; }
  btn.dataset.confirming = '1';
  btn.classList.add('confirm-danger');
  const prevTitle = btn.title;
  btn.title = 'Cliquer a nouveau pour confirmer';
  clearTimeout(btn._confirmTimer);
  btn._confirmTimer = setTimeout(()=>{ btn.dataset.confirming=''; btn.classList.remove('confirm-danger'); btn.title=prevTitle; }, 2500);
}

/* ══════════ OPEN / CREATE SHEET (unified view = editor) ══════════ */
function openSheetById(id) {
  const s = sheets.find(x=>x.id===id);
  if (!s) return;
  current = JSON.parse(JSON.stringify(s));
  showView('sheet');
  renderSheetView();
}

function newSheet() {
  current = {
    id: genId(), title:'', artist:'', capo:0, bpm:0, difficulty:'', youtube:'', notes:'',
    color:'gold',
    sections:[newBlankSection('Accords')],
    updatedAt: Date.now(),
  };
  showView('sheet');
  renderSheetView();
  requestAnimationFrame(()=>document.getElementById('sv-title-input')?.focus());
}

function deleteCurrentSheet(e) {
  confirmThenDelete(e.currentTarget, ()=>{
    if (current) { sheets = sheets.filter(x=>x.id!==current.id); save(); }
    toast('Fiche supprimee');
    goHome();
  });
}

/* ══════════ AUTOSAVE ══════════ */
function scheduleAutosave() {
  if (!current) return;
  current.updatedAt = Date.now();
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(commitAutosave, 500);
}
function commitAutosave() {
  if (!current || !current.title.trim()) return;
  const snap = JSON.parse(JSON.stringify(current));
  const i = sheets.findIndex(x=>x.id===snap.id);
  if (i>=0) sheets[i]=snap; else sheets.unshift(snap);
  save();
  flashAutosaveIndicator();
}
function flashAutosaveIndicator() {
  const el = document.getElementById('autosave-ind');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(flashAutosaveIndicator._t);
  flashAutosaveIndicator._t = setTimeout(()=>el.classList.remove('show'), 1300);
}

/* ══════════ SHEET FIELDS (title/artist/notes/details) ══════════ */
function updateTitle(v) { current.title = v; scheduleAutosave(); }
function updateArtist(v) { current.artist = v; scheduleAutosave(); renderBadges(); }
function updateNotes(v) { current.notes = v; scheduleAutosave(); }

function renderBadges() {
  const s = current;
  let badges = '';
  if (s.capo>0) badges += `<span class="badge bg">Capo ${s.capo}</span>`;
  if (s.bpm)    badges += `<span class="badge bs">${s.bpm} BPM</span>`;
  if (s.difficulty) badges += `<span class="badge bd">${esc(s.difficulty)}</span>`;
  if (s.youtube) badges += `<a class="badge by" href="${esc(s.youtube)}" target="_blank" onclick="event.stopPropagation()">${playSVG()} YouTube</a>`;
  document.getElementById('sv-badges').innerHTML = badges;
}

function renderSheetView() {
  document.getElementById('sv-title-input').value = current.title;
  document.getElementById('sv-artist-input').value = current.artist||'';
  document.getElementById('sv-notes').value = current.notes||'';
  renderBadges();
  renderSections();
}

/* ══════════ DETAILS DRAWER ══════════ */
function openDetailsModal() {
  const capoSel = document.getElementById('dd-capo');
  capoSel.innerHTML = ['Sans','Frette 1','Frette 2','Frette 3','Frette 4','Frette 5','Frette 6','Frette 7']
    .map((lbl,i)=>`<option value="${i}">${lbl}</option>`).join('');
  capoSel.value = current.capo||0;
  document.getElementById('dd-bpm').value = current.bpm||'';
  document.getElementById('dd-diff').value = current.difficulty||'';
  document.getElementById('dd-youtube').value = current.youtube||'';
  document.querySelectorAll('#dd-swatches .csw').forEach(sw=>sw.classList.toggle('on', sw.dataset.c===(current.color||'gold')));
  document.getElementById('details-modal').classList.remove('hidden');
}
function closeDetailsModal() { document.getElementById('details-modal').classList.add('hidden'); }
function updateDetailField(field, val) {
  current[field] = val;
  if (field==='color') document.querySelectorAll('#dd-swatches .csw').forEach(sw=>sw.classList.toggle('on', sw.dataset.c===val));
  scheduleAutosave();
  renderBadges();
}

/* ══════════ SECTIONS (the central editable unit) ══════════ */
function renderSections() {
  const list = document.getElementById('sv-sections');
  const DOTS = ['d0','d1','d2','d3','d4'];
  list.innerHTML = current.sections.map((sec,i) => `
    <div class="sec-card ${sec.collapsed?'collapsed':''}" data-idx="${i}">
      <div class="sec-card-hdr">
        <button class="drag-handle" title="Glisser pour reordonner" onpointerdown="secDragStart(event,${i})">⠿</button>
        <div class="sec-dot ${DOTS[i%5]}"></div>
        <input class="sec-name-input" value="${esc(sec.name)}" placeholder="Nom de la partie" oninput="updateSectionField(${i},'name',this.value)">
        <input class="sec-comment-input" value="${esc(sec.comment||'')}" placeholder="Commentaire (x2, lent...)" oninput="updateSectionField(${i},'comment',this.value)">
        <div class="sec-card-actions">
          <button class="btn-icon-sm" title="${sec.collapsed?'Deplier':'Replier'}" onclick="toggleSectionCollapse(${i})">${sec.collapsed?'⌄':'⌃'}</button>
          <button class="btn-icon-sm" title="Dupliquer cette partie" onclick="duplicateSection(${i})">⧉</button>
          <button class="btn-icon-sm danger" title="Supprimer cette partie" onclick="removeSection(${i})">✕</button>
        </div>
      </div>
      <div class="sec-card-body" ${sec.collapsed?'style="display:none"':''}>
        <div class="chips-row">
          ${sec.chords.map((ch,ci)=>`
            <div class="chip">
              <button class="chip-main" onclick="openChordModal(${i},${ci})">${chordChipContent(ch)}</button>
              <button class="chip-rm" onclick="removeChord(${i},${ci})" title="Retirer">✕</button>
            </div>`).join('')}
          <button class="chip-add" onclick="openChordModal(${i},null)">+ Accord</button>
        </div>
        <div class="rhythm-zone">
          <div class="rz-lbl">Rythme</div>
          <select onchange="onSectionRhythmChange(${i},this.value)">
            ${RHYTHMS.map(r=>`<option value="${r.id}" ${sec.rhythm===r.id?'selected':''}>${r.label} — ${r.desc}</option>`).join('')}
          </select>
          <div id="srp-${i}" style="margin-top:8px">${sec.rhythm!=='custom' ? buildRhythmFull(sec.rhythm, sec.customBeats) : ''}</div>
          <div class="rce-wrap" id="rce-sec-${i}" style="display:${sec.rhythm==='custom'?'block':'none'}"></div>
        </div>
      </div>
    </div>`).join('');

  current.sections.forEach((sec,i)=>{ if (sec.rhythm==='custom') renderRhythmEditorUI(i); });
}

function updateSectionField(i, field, val) { current.sections[i][field] = val; scheduleAutosave(); }

function toggleSectionCollapse(i) {
  current.sections[i].collapsed = !current.sections[i].collapsed;
  renderSections();
  scheduleAutosave();
}

function duplicateSection(i) {
  const clone = JSON.parse(JSON.stringify(current.sections[i]));
  clone.name = (clone.name || 'Partie') + ' (copie)';
  current.sections.splice(i+1, 0, clone);
  renderSections();
  scheduleAutosave();
  toast('Partie dupliquee');
}

function removeSection(i) {
  if (current.sections.length <= 1) { toast('La fiche doit garder au moins une partie', 'err'); return; }
  current.sections.splice(i, 1);
  renderSections();
  scheduleAutosave();
}

function addSectionLive() {
  const DEFAULT = ['Intro','Couplet','Refrain','Pont','Outro'];
  const name = DEFAULT[current.sections.length] || `Partie ${current.sections.length+1}`;
  current.sections.push(newBlankSection(name));
  renderSections();
  scheduleAutosave();
  const cards = document.querySelectorAll('.sec-card');
  const last = cards[cards.length-1];
  const nameInput = last?.querySelector('.sec-name-input');
  if (nameInput) { nameInput.focus(); nameInput.select(); }
  last?.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ══════════ DRAG TO REORDER SECTIONS ══════════ */
function secDragStart(e, idx) {
  e.preventDefault();
  const card = e.currentTarget.closest('.sec-card');
  secDragState = { card };
  card.classList.add('dragging');
  document.addEventListener('pointermove', secDragMove);
  document.addEventListener('pointerup', secDragEnd);
}
function secDragMove(e) {
  if (!secDragState) return;
  const list = document.getElementById('sv-sections');
  const cards = [...list.querySelectorAll('.sec-card:not(.dragging)')];
  const y = e.clientY;
  const target = cards.find(c => {
    const r = c.getBoundingClientRect();
    return y < r.top + r.height/2;
  });
  if (target) list.insertBefore(secDragState.card, target);
  else list.appendChild(secDragState.card);
}
function secDragEnd() {
  if (!secDragState) return;
  const list = document.getElementById('sv-sections');
  const newOrder = [...list.querySelectorAll('.sec-card')].map(c => parseInt(c.dataset.idx));
  current.sections = newOrder.map(i => current.sections[i]);
  secDragState.card.classList.remove('dragging');
  secDragState = null;
  document.removeEventListener('pointermove', secDragMove);
  document.removeEventListener('pointerup', secDragEnd);
  renderSections();
  scheduleAutosave();
}

/* ══════════ CHORD DIAGRAM SVG ══════════ */
function buildChordSVG(name, customFingers) {
  const db = CHORD_DB[name];
  const fingers = customFingers || (db ? db.f : null);
  const W=72, H=82, strings=6, frets=4;
  const ml=12, mt=22, cw=(W-ml-8)/(strings-1), rh=(H-mt-8)/frets;
  if (!fingers) return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2+4}" text-anchor="middle" font-size="11" fill="#4a3c2c" font-family="DM Sans">?</text></svg>`;
  const minF = Math.max(1, Math.min(...fingers.filter(f=>f>0)));
  const off = minF>3 ? minF-1 : 0;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  if (off===0) svg += `<rect x="${ml}" y="${mt-3}" width="${cw*(strings-1)}" height="3.5" rx="1.5" fill="#c8b49a"/>`;
  else svg += `<text x="${ml-7}" y="${mt+rh/2+4}" text-anchor="end" font-size="8" fill="#7d6c58">${off+1}fr</text>`;
  for(let f=0;f<=frets;f++) svg+=`<line x1="${ml}" y1="${mt+f*rh}" x2="${ml+cw*(strings-1)}" y2="${mt+f*rh}" stroke="#362818" stroke-width="1"/>`;
  for(let s=0;s<strings;s++) svg+=`<line x1="${ml+s*cw}" y1="${mt}" x2="${ml+s*cw}" y2="${mt+frets*rh}" stroke="#362818" stroke-width="1"/>`;
  fingers.forEach((fret,idx)=>{
    const x=ml+(5-idx)*cw;
    if(fret===-1) svg+=`<text x="${x}" y="${mt-6}" text-anchor="middle" font-size="10" fill="#4a3c2c">x</text>`;
    else if(fret===0) svg+=`<circle cx="${x}" cy="${mt-7}" r="3.5" fill="none" stroke="#7d6c58" stroke-width="1.5"/>`;
    else{const df=fret-off;if(df>=1&&df<=frets)svg+=`<circle cx="${x}" cy="${mt+(df-.5)*rh}" r="${rh*.37}" fill="#c8783a"/>`;}
  });
  return svg+'</svg>';
}

/* ══════════ RHYTHM CURVE — down peaks below baseline, up peaks above, sized by force ══════════ */
function renderCurve(beats, label) {
  if (!beats || !beats.length) return `<div style="font-size:12px;color:var(--cream4)">Aucun rythme defini</div>`;
  const W = Math.max(260, beats.length*54+32);
  const H = 100;
  const baseline = H/2;
  const maxAmp = 34;
  const bw = (W-32)/beats.length;
  const uid = 'g'+Math.random().toString(36).slice(2,8);

  const pts = beats.map((b,i)=>{
    const cx = 16+i*bw+bw/2;
    let y = baseline;
    if (b.dir==='down') y = baseline + b.force*maxAmp;
    else if (b.dir==='up') y = baseline - b.force*maxAmp;
    return {cx, y, dir:b.dir, force:b.force};
  });

  function mkPath(ps) {
    let d = `M ${ps[0].cx} ${ps[0].y}`;
    for (let i=0;i<ps.length-1;i++) {
      const mid = (ps[i].cx+ps[i+1].cx)/2;
      d += ` C ${mid} ${ps[i].y}, ${mid} ${ps[i+1].y}, ${ps[i+1].cx} ${ps[i+1].y}`;
    }
    return d;
  }
  const pathD = mkPath(pts);
  const areaD = pathD + ` L ${pts[pts.length-1].cx} ${baseline} L ${pts[0].cx} ${baseline} Z`;

  let svg = `<svg width="${W}" height="${H+22}" viewBox="0 0 ${W} ${H+22}" style="display:block;overflow:visible">
    <defs>
      <clipPath id="up-${uid}"><rect x="0" y="0" width="${W}" height="${baseline}"/></clipPath>
      <clipPath id="dn-${uid}"><rect x="0" y="${baseline}" width="${W}" height="${H-baseline}"/></clipPath>
    </defs>
    <line x1="16" y1="${baseline}" x2="${W-16}" y2="${baseline}" stroke="#47341f" stroke-width="1.5"/>`;

  beats.forEach((_,i)=>{ if(i===0) return; const x=16+i*bw; svg+=`<line x1="${x}" y1="6" x2="${x}" y2="${H-6}" stroke="#362818" stroke-width="1" stroke-dasharray="3,3"/>`; });

  svg += `<path d="${areaD}" fill="#6a9070" opacity="0.3" clip-path="url(#up-${uid})"/>`;
  svg += `<path d="${areaD}" fill="#c8783a" opacity="0.32" clip-path="url(#dn-${uid})"/>`;
  svg += `<path d="${pathD}" fill="none" stroke="#e8964e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;

  pts.forEach((p,i)=>{
    if (p.dir==='silence') {
      svg += `<rect x="${p.cx-7}" y="${baseline-6}" width="14" height="12" rx="3" fill="none" stroke="#47341f" stroke-width="1.4" stroke-dasharray="2,2"/>`;
    } else {
      const col = p.dir==='down' ? '#e8964e' : '#8ab890';
      const r = 3+p.force*3.2;
      if (p.force>0.75) svg += `<circle cx="${p.cx}" cy="${p.y}" r="${r+4}" fill="none" stroke="${col}" stroke-width="1" opacity=".35"/>`;
      svg += `<circle cx="${p.cx}" cy="${p.y}" r="${r}" fill="${col}"/>`;
      const arrow = p.dir==='down' ? '↓' : '↑';
      const arrY = p.dir==='down' ? p.y+15 : p.y-9;
      svg += `<text x="${p.cx}" y="${arrY}" text-anchor="middle" font-size="${9+p.force*4}" fill="${col}" font-family="DM Sans" font-weight="${p.force>0.7?'700':'400'}">${arrow}</text>`;
    }
    svg += `<text x="${p.cx}" y="${H+16}" text-anchor="middle" font-size="8" fill="#4a3c2c" font-family="DM Sans">${i+1}</text>`;
  });

  svg += '</svg>';
  return `<div>${svg}${label?`<div style="font-size:10px;color:var(--cream4);margin-top:2px;letter-spacing:.5px">${esc(label)}</div>`:''}</div>`;
}

function beatsFromRaw(raw) {
  return (raw||[]).map(v => v>0.04 ? {dir:'up',force:Math.min(1,v)} : v<-0.04 ? {dir:'down',force:Math.min(1,-v)} : {dir:'silence',force:0});
}

function buildRhythmFull(rhythmId, customBeats) {
  if (rhythmId === 'custom') {
    if (!customBeats || !customBeats.length) return `<div style="font-size:12px;color:var(--cream4)">Rythme personnalise (vide)</div>`;
    return renderCurve(beatsFromRaw(customBeats), 'Rythme personnalise');
  }
  const r = RHYTHMS.find(x=>x.id===rhythmId);
  if (!r) return '';
  return renderCurve(r.beats, r.label);
}

/* ══════════ RHYTHM SELECT HANDLER (per section) ══════════ */
function onSectionRhythmChange(i, id) {
  current.sections[i].rhythm = id;
  if (id === 'custom' && !(current.sections[i].customBeats && current.sections[i].customBeats.length)) {
    current.sections[i].customBeats = [0,0,0,0];
  }
  renderSections();
  scheduleAutosave();
}

/* ══════════ INTERACTIVE RHYTHM CURVE EDITOR ══════════ */
function renderRhythmEditorUI(i) {
  const values = current.sections[i].customBeats || (current.sections[i].customBeats = [0,0,0,0]);
  const wrap = document.getElementById(`rce-sec-${i}`);
  if (!wrap) return;
  const bars = values.map((v,bi) => `
    <div class="rce-bar-col">
      <div class="rce-bar" onpointerdown="rceStartDrag(event,${i},${bi})">
        <div class="rce-mid"></div>
        <div class="rce-fill ${v>=0?'up':'down'}" style="height:${Math.abs(v)*48}%;${v>=0?'bottom:50%;top:auto':'top:50%;bottom:auto'}"></div>
        <div class="rce-handle" style="top:${50 - v*48}%"></div>
      </div>
      <button class="rce-rm" onclick="rceRemoveBeat(${i},${bi})">x</button>
    </div>`).join('');
  wrap.innerHTML = `
    <div class="rce-bars">${bars}</div>
    <div class="rce-controls">
      <button class="add-beat-btn" onclick="rceAddBeat(${i})">+ Temps</button>
      <span class="rce-hint">Glisse chaque barre : vers le bas = coup fort vers le bas, vers le haut = coup leger vers le haut. Plus tu vas loin du centre, plus le coup est fort.</span>
    </div>
    <div class="rce-preview" id="rcp-${i}"></div>`;
  updateRhythmEditorPreview(i);
}

let rceDragState = null;
function rceStartDrag(e, i, idx) {
  e.preventDefault();
  rceDragState = {i, idx, barEl: e.currentTarget};
  document.addEventListener('pointermove', rceOnDrag);
  document.addEventListener('pointerup', rceEndDrag);
  rceOnDrag(e);
}
function rceOnDrag(e) {
  if (!rceDragState) return;
  const {i, idx, barEl} = rceDragState;
  const rect = barEl.getBoundingClientRect();
  if (rect.height === 0) return;
  let rel = (e.clientY - rect.top) / rect.height;
  rel = Math.max(0, Math.min(1, rel));
  const v = Math.round((0.5-rel)*2*100)/100;
  current.sections[i].customBeats[idx] = v;
  const handle = barEl.querySelector('.rce-handle');
  const fill = barEl.querySelector('.rce-fill');
  handle.style.top = (50 - v*48) + '%';
  fill.className = 'rce-fill ' + (v>=0?'up':'down');
  fill.style.height = Math.abs(v)*48 + '%';
  if (v>=0) { fill.style.bottom='50%'; fill.style.top='auto'; }
  else { fill.style.top='50%'; fill.style.bottom='auto'; }
  updateRhythmEditorPreview(i);
}
function rceEndDrag() {
  rceDragState = null;
  document.removeEventListener('pointermove', rceOnDrag);
  document.removeEventListener('pointerup', rceEndDrag);
  scheduleAutosave();
}
function updateRhythmEditorPreview(i) {
  const values = current.sections[i].customBeats || [];
  const beats = beatsFromRaw(values);
  const el = document.getElementById(`rcp-${i}`);
  if (el) el.innerHTML = renderCurve(beats, 'Apercu de ta rythmique');
}
function rceAddBeat(i) {
  if (current.sections[i].customBeats.length >= 16) return;
  current.sections[i].customBeats.push(0);
  renderRhythmEditorUI(i);
  scheduleAutosave();
}
function rceRemoveBeat(i, idx) {
  if (current.sections[i].customBeats.length <= 1) return;
  current.sections[i].customBeats.splice(idx,1);
  renderRhythmEditorUI(i);
  scheduleAutosave();
}

/* ══════════ CHORD PICKER MODAL ══════════ */
function openChordModal(sectionIdx, chordIdx) {
  chordModalTarget = {sectionIdx, chordIdx};
  ccbFrets = [-1,0,0,0,0,0];
  buildChordGrid('');
  document.getElementById('ccb-name').value='';
  buildFretboardBuilder();

}
function closeChordModal() { document.getElementById('chord-modal').classList.add('hidden'); chordModalTarget=null; }
function filterChords() { buildChordGrid(document.getElementById('chord-search').value); }

function buildChordGrid(q) {
  const grid = document.getElementById('chord-grid');
  const keys = Object.keys(CHORD_DB).filter(k=>!q||k.toLowerCase().includes(q.toLowerCase()));
  grid.innerHTML = keys.map(k=>`
    <button class="chord-pick-btn" onclick="selectChordFromModal('${k}')">
      <div class="cp-name">${esc(k)}</div>

function selectChordFromModal(name) { applyChordToTarget(name, null); closeChordModal(); }

function applyChordToTarget(name, fingers) {
  if (!chordModalTarget) return;
  const {sectionIdx, chordIdx} = chordModalTarget;
  const chord = {name, fingers: fingers||null};
  if (chordIdx === null) current.sections[sectionIdx].chords.push(chord);
  else current.sections[sectionIdx].chords[chordIdx] = chord;
  renderSections();
  scheduleAutosave();
}

/* Custom chord fretboard builder */
function buildFretboardBuilder() {
  const con = document.getElementById('fretboard-builder');
  const FRET_MAX = 5;
  con.innerHTML = STRING_NAMES.map((sn, si) => {
    let btns = `<div class="string-name">${sn}</div>`;
    btns += `<button class="fret-btn ${ccbFrets[si]===-1?'muted':''}" onclick="setCCBFret(${si},-1)" title="Muet">x</button>`;
    btns += `<button class="fret-btn ${ccbFrets[si]===0?'open':''}" onclick="setCCBFret(${si},0)" title="Corde a vide">o</button>`;
    for (let f=1; f<=FRET_MAX; f++) btns += `<button class="fret-btn ${ccbFrets[si]===f?'on':''}" onclick="setCCBFret(${si},${f})">${f}</button>`;
    return `<div class="string-col">${btns}</div>`;
  }).join('');
  refreshCCBPreview();
}
function setCCBFret(strIdx, fret) { ccbFrets[strIdx] = fret; buildFretboardBuilder(); }
function refreshCCBPreview() {
  const prev = document.getElementById('ccb-preview');
  if (prev) prev.innerHTML = buildChordSVG('?', ccbFrets);

  const name = document.getElementById('ccb-name').value.trim() || 'Custom';

function buildChordSVGLight(name, customFingers) {
  const db = CHORD_DB[name];
  const fingers = customFingers||(db?db.f:null);
  const W=60,H=68,strings=6,frets=4;
  const ml=10,mt=18,cw=(W-ml-6)/(strings-1),rh=(H-mt-6)/frets;
  if (!fingers) return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="10" fill="#aaa">?</text></svg>`;
  const minF=Math.max(1,Math.min(...fingers.filter(f=>f>0)));
  const off=minF>3?minF-1:0;
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  if (off===0) svg+=`<rect x="${ml}" y="${mt-3}" width="${cw*(strings-1)}" height="3" rx="1" fill="#1a1410"/>`;
  for (let f=0;f<=frets;f++) svg+=`<line x1="${ml}" y1="${mt+f*rh}" x2="${ml+cw*(strings-1)}" y2="${mt+f*rh}" stroke="#ccc" stroke-width="1"/>`;
  for (let s=0;s<strings;s++) svg+=`<line x1="${ml+s*cw}" y1="${mt}" x2="${ml+s*cw}" y2="${mt+frets*rh}" stroke="#ccc" stroke-width="1"/>`;
  fingers.forEach((fret,idx)=>{
    const x=ml+(5-idx)*cw;
    if (fret===-1) svg+=`<text x="${x}" y="${mt-5}" text-anchor="middle" font-size="9" fill="#999">x</text>`;
    else if (fret===0) svg+=`<circle cx="${x}" cy="${mt-6}" r="3" fill="none" stroke="#999" stroke-width="1"/>`;
    else { const df=fret-off; if (df>=1&&df<=frets) svg+=`<circle cx="${x}" cy="${mt+(df-.5)*rh}" r="${rh*.34}" fill="#c8783a"/>`; }
  });
  return svg+'</svg>';
}

function buildRhythmLight(rhythmId, customBeats) {
  let beats, label;
  if (rhythmId==='custom') {
    if (!customBeats || !customBeats.length) return '';
    beats = beatsFromRaw(customBeats); label='Rythme personnalise';
  } else {
    const r = RHYTHMS.find(x=>x.id===rhythmId);
    if (!r || !r.beats.length) return '';
    beats = r.beats; label = r.label;
  }
  const W=Math.max(200,beats.length*46+24), H=56, bw=(W-24)/beats.length, baseline=H/2;
  const maxAmp=22;
  const pts = beats.map((b,i)=>({cx:12+i*bw+bw/2, y: b.dir==='down'?baseline+b.force*maxAmp : b.dir==='up'?baseline-b.force*maxAmp : baseline, dir:b.dir, force:b.force}));
  function mPath(ps){let d=`M ${ps[0].cx} ${ps[0].y}`;for(let i=0;i<ps.length-1;i++){const mid=(ps[i].cx+ps[i+1].cx)/2;d+=` C ${mid} ${ps[i].y}, ${mid} ${ps[i+1].y}, ${ps[i+1].cx} ${ps[i+1].y}`;}return d;}
  const pd = mPath(pts);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;
  svg += `<line x1="12" y1="${baseline}" x2="${W-12}" y2="${baseline}" stroke="#e8dfc8" stroke-width="1"/>`;
  svg += `<path d="${pd} L ${pts[pts.length-1].cx} ${baseline} L ${pts[0].cx} ${baseline} Z" fill="#c8783a22"/>`;
  svg += `<path d="${pd}" fill="none" stroke="#c8783a" stroke-width="2" stroke-linecap="round"/>`;
  pts.forEach(p=>{ if(p.dir!=='silence') svg += `<circle cx="${p.cx}" cy="${p.y}" r="${2.5+p.force*2}" fill="${p.dir==='down'?'#c8783a':'#4a7a50'}"/>`; });
  svg += `<text x="${W/2}" y="${H-2}" text-anchor="middle" font-size="8" fill="#7d6c58" font-family="DM Sans">${esc(label)}</text>`;
  return svg + '</svg>';
}

/* ══════════ DOWNLOAD / PRINT ══════════ */
function downloadSVG() {
  const area = document.getElementById('print-area');
  const el = area.querySelector('div');
  if (!el) return;
  const w = el.scrollWidth || 620, h = el.scrollHeight || 800;
  const data = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'><foreignObject width='100%' height='100%'><div xmlns='http://www.w3.org/1999/xhtml'>${el.outerHTML}</div></foreignObject></svg>`;
  const blob = new Blob([data], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fiche-guitare.svg'; a.click();
  URL.revokeObjectURL(url);
  toast('Fichier SVG telecharge !');
}
function doPrint() {
  const area = document.getElementById('print-area');
  const content = area.innerHTML;
  const win = window.open('','_blank','width=820,height=1000');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">' +
    '<style>body{margin:0;padding:20px;font-family:\'DM Sans\',sans-serif;background:white}@page{margin:15mm}@media print{body{padding:0}}</style>' +
    '</head><body>' + content + '</body></html>');
  win.document.close();
  setTimeout(()=>win.print(), 800);
}

/* ══════════ TOAST ══════════ */
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type==='err'?' err':'') + ' show';
  setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ══════════ KEYBOARD ══════════ */
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape') {
    const openModal = document.querySelector('.modal-overlay:not(.hidden)');
    if (openModal) { openModal.classList.add('hidden'); chordModalTarget=null; return; }
    if (document.activeElement && document.activeElement.matches('.sec-name-input,.sec-comment-input,.sv-title-input,.sv-artist-input')) {
      document.activeElement.blur();
    }
    return;
  }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('.sec-name-input,.sec-comment-input,.sv-title-input,.sv-artist-input')) {
    document.activeElement.blur();
  }
});
