<!-- ══ EDITOR ══ -->
<div class="view" id="v-ed">
  <div class="wrap-narrow ed-wrap">
    <div class="ed-top">
      <button type="button" class="ed-x" onclick="edClose()" aria-label="Fermer sans enregistrer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="ed-title">Nouvelle fiche</h2>
      <button type="button" class="ed-save" id="ed-save" onclick="edSaveTap()"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Enregistrer</button>
    </div>

    <div class="ed-ta">
      <input type="text" id="f-title" class="ed-in ed-in-t" placeholder="Titre du morceau" aria-label="Titre du morceau" autocomplete="off" enterkeyhint="next" oninput="edSyncSave()" onkeydown="edNext(event,'f-artist')">
      <input type="text" id="f-artist" class="ed-in ed-in-a" placeholder="Artiste" aria-label="Artiste (facultatif)" autocomplete="off" enterkeyhint="done">
    </div>

    <div class="ed-meta" id="ed-meta"></div>
    <div class="ed-lab"><b>Accords</b></div>
    <div class="ed-chords">
      <div class="qc-row">
        <input type="text" id="f-chords" placeholder="Taper les accords (Em G D…)" aria-label="Taper les accords, séparés par des espaces" autocomplete="off" autocapitalize="off" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();addChordLine()}">
        <button type="button" class="btn btn-ghost" onclick="addChordLine()">Ajouter</button>
      </div>
      <div class="qc-sugg" id="qc-sugg"></div>
    </div>
    <div id="parts-ed"></div>
    <div class="ed-lab" id="ed-rh-lab"><b>Rythme</b></div>
    <div class="ed-dock"><div id="ed-recbar"></div></div>
    <div class="qc-parts" id="qc-parts"></div>
    <div id="ed-solo-rh"></div>

    <div class="ed-lab"><b>Tutos et liens</b><small>facultatif</small></div>
    <details class="ed-row">
      <summary><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/></svg>Ajouter un lien<small>original, tuto…</small></summary>
      <div class="ed-row-b">
        <label for="f-orig">Version originale <span class="opt-tag">(YouTube, Spotify… pour « Écouter l’original »)</span></label>
        <div class="qc-row">
          <input type="url" id="f-orig" placeholder="https://…" autocomplete="off" inputmode="url" oninput="draft.original={url:this.value.trim()}">
          <button type="button" class="btn btn-ghost" onclick="searchOriginal()">Chercher</button>
        </div>
        <button type="button" class="rb-lnk acc" style="margin-top:6px" onclick="edOpenCoffre('link-in')">Ajouter un tuto ou une vidéo ›</button>
      </div>
    </details>
    <button type="button" class="ed-row ed-rowb" onclick="edOpenCoffre('draft-media-audio')"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><path d="M12 19v4"/></svg>Enregistrer une prise audio</button>

    <details class="ed-more" id="more-opts">
      <summary>Plus d’options <span>BPM, accordage, difficulté, couleur, notes, Médias</span></summary>
      <div class="ed-more-b">
        <div class="frow qc-meta">
          <div class="fg" style="margin-bottom:0"><label>BPM</label><input type="number" inputmode="numeric" min="30" max="300" id="f-bpm" placeholder="Ex : 90" oninput="draft.bpm=+this.value||0"></div>
          <div class="fg" style="margin-bottom:0"><label>Capo</label><select id="f-capo" onchange="draft.capo=+this.value;edCapoSync()"></select></div>
          <div class="fg" style="margin-bottom:0;display:flex;align-items:flex-end"><button type="button" class="btn btn-ghost" onclick="tapTempo(this)">Tap tempo</button></div>
        </div>
        <div class="fg" style="margin-top:14px">
          <label>Accordage</label><input type="text" id="f-tuning" placeholder="Standard, Drop D..." oninput="draft.tuning=this.value">
        </div>
        <div class="fg" style="margin-top:14px">
          <label>Couleur du repère</label>
          <div class="opt-blocks" id="color-row"></div>
        </div>
        <div id="opt-host"></div>
        <div class="opt-blocks" id="opt-adders"></div>
        <button class="btn btn-danger btn-sm" id="ed-del" onclick="delFromEditor()" style="margin-top:18px">Supprimer la fiche</button>
      </div>
    </details>
  </div>
</div>
