    <div class="fcard" style="text-align:center;padding:32px 20px">

      <div id="tuner-display" style="margin-top:22px;display:none"></div>
    </div>

    <div class="fcard">
      <div class="fcard-t">Cordes à vide (référence)</div>
      <p style="font-size:12px;color:var(--cream4);margin-bottom:14px">Pas de micro sous la main ? Clique une corde pour entendre la note juste.</p>

    </div>
